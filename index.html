<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Lone Crafts Admin</title>
<style>
:root{--c:#4b2e5a;--s:#d98e04;--r:#a63a1f;--bg:#f6f4f8;--l:#ddd6e3;--g:#1faa59;--ink:#1e1a24}
*{box-sizing:border-box;margin:0}body{font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}input,select,textarea{width:100%;padding:10px;border:1.5px solid var(--l);border-radius:8px;background:#fff}
button{cursor:pointer;border:0;border-radius:20px;padding:10px 16px;font-weight:700;background:var(--c);color:#fff}
.o{background:#fff;color:var(--c);border:1.5px solid var(--c)}.g{background:var(--g)}.rd{background:var(--r)}
header{background:var(--c);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--l);position:sticky;top:52px;z-index:4}
nav button{flex:none;background:#fff;color:var(--ink);border:1.5px solid var(--l);padding:8px 14px}nav .on{background:var(--c);color:#fff;border-color:var(--c)}
main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--l);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.st b{display:block;font-size:1.35rem;color:var(--c)}
label{font-size:.75rem;font-weight:700;color:#6b6475;display:block;margin-top:6px}h3{margin-bottom:6px}
.it{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:6px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--l)}.it .d{grid-column:1/-1}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--l)}.row img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:var(--l)}.row>div{flex:1;min-width:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.bar input{flex:1;min-width:140px}.tag{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--l)}
#iv{position:fixed;inset:0;background:#fff;z-index:20;overflow:auto;padding:12px}.sheet{max-width:720px;margin:auto;font-size:13px}.sheet table{width:100%;border-collapse:collapse;margin:8px 0}.sheet td,.sheet th{border:1px solid #999;padding:4px 6px;text-align:left}
@media print{body>*:not(#iv){display:none!important}#iv .no{display:none}#iv{position:static;padding:0}}
</style></head><body>
<div id="lock" style="max-width:380px;margin:12vh auto;padding:18px"><div class="card"><h2>Lone Crafts Admin</h2>
<form id="lf"><label>Passphrase</label><input id="pw" type="password" autocomplete="current-password"><p id="err" style="color:var(--r)"></p><button style="width:100%;margin-top:8px">Unlock</button></form>
<div id="gbtn" style="margin-top:12px"></div><pre id="setup" style="white-space:pre-wrap;word-break:break-all;font-size:.75rem;margin-top:10px"></pre></div></div>
<div id="app" hidden>
<header><b>Lone Crafts Admin</b><span><small id="sync"></small> <button class="o" id="out">Lock</button></span></header><nav id="nav"></nav>
<main>
<section id="t-home"><div class="grid" id="stats"></div><div class="card" style="margin-top:12px"><h3>Recent bills</h3><div id="recent"></div></div></section>
<section id="t-bill" hidden><div class="card"><h3>Customer</h3>
<label>Name</label><input id="cn"><label>Phone (WhatsApp)</label><input id="cp" type="tel"><label>Address</label><textarea id="ca" rows="2"></textarea>
<label>GSTIN (optional)</label><input id="cg"><label>State</label><input id="cs" placeholder="e.g. Jammu and Kashmir"><label>Date</label><input id="dt" type="date">
<label><input id="inter" type="checkbox" style="width:auto"> Other state (use IGST)</label></div>
<div class="card"><h3>Items</h3><datalist id="pl"></datalist><div id="items"></div><button class="o" id="addI">+ Add item</button>
<label>Discount (₹ on whole bill)</label><input id="disc" type="number" min="0" value="0"></div>
<div class="card" id="tot"></div><div class="bar"><button class="o" id="prev">Preview</button><button class="g" id="save">Save bill</button></div></section>
<section id="t-prod" hidden><div class="bar"><input id="ps" type="search" placeholder="Search products"><button id="addP">+ Add product</button><button class="o" id="rP">Refresh</button></div><div class="card" id="plist"></div></section>
<section id="t-pay" hidden><div class="bar"><input id="ys" type="search" placeholder="Search by bill number"><button class="o" id="rY">Refresh</button></div><div class="card" id="paylist"></div></section>
<section id="t-prof" hidden><div class="card"><h3>Business profile</h3><p style="font-size:.85rem;color:#6b6475">Enter once. It fills every new bill and you can edit it any time.</p><div id="pf"></div><button id="sp" style="margin-top:10px">Save profile</button></div></section>
</main></div>
<div id="iv" hidden><div class="no bar"><button class="o" id="ivx">Close</button><button id="ivp">Print / Save PDF</button><button class="g" id="ivw">Send on WhatsApp</button></div><div id="ivb" class="sheet"></div></div>
<script>
/* ===== EDIT THESE (see Code.gs for setup steps) ===== */
const CFG={API:"",GOOGLE_CLIENT_ID:"",PRODUCT_FORM:"https://forms.gle/2zDtkswPH1f8fDqz5",
PRODUCTS_CSV:"https://docs.google.com/spreadsheets/d/e/2PACX-1vR-JzRVAFn6o-3a1jyLlQV2az4yY2cOYSN8XH9ofBq0rkT2YQzS249HcTIUn6KN19mQSTvr_UkFHfJt/pub?output=csv",
PAYMENTS_CSV:"https://docs.google.com/spreadsheets/d/1z2oh4VZC_JlcGIUp0AI_p6OIsRfTaCous-4kEFL_s8o/gviz/tq?tqx=out:csv",UI_HASH:"c23b4e81d2862fd5d6ec938051a847d6f3a3cf74e3ba3e60e24e4fbd7dfe2814"};
/* ==================================================== */
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const m=n=>"₹"+(+n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}),wa=n=>{n=String(n||"").replace(/\D/g,"");return n.length===10?"91"+n:n};
let KEY="",profile=ls("lc_prof",{}),bills=ls("lc_bills",[]),products=[],pay=[],items=[],cur=null;
const FIELDS=[["bn","Business name"],["ba","Address"],["bp","Phone"],["be","Email"],["bg","GSTIN"],["bs","State"],["bb","Bank / UPI details"],["bx","Bill prefix (e.g. LC)"],["bd","Default GST % (e.g. 5)"],["bt","Terms (printed on bill)"]];
function words(n){const a="One Two Three Four Five Six Seven Eight Nine Ten Eleven Twelve Thirteen Fourteen Fifteen Sixteen Seventeen Eighteen Nineteen".split(" "),b="_ _ Twenty Thirty Forty Fifty Sixty Seventy Eighty Ninety".split(" "),t=n=>n<20?a[n-1]||"":b[n/10|0]+(n%10?" "+a[n%10-1]:""),h=n=>(n>99?a[(n/100|0)-1]+" Hundred"+(n%100?" ":""):"")+t(n%100);let s="";const cr=n/1e7|0,lk=(n/1e5|0)%100,th=(n/1e3|0)%100,r=n%1000;if(cr)s+=t(cr)+" Crore ";if(lk)s+=t(lk)+" Lakh ";if(th)s+=t(th)+" Thousand ";if(r)s+=h(r);return(s.trim()||"Zero")+" Rupees Only"}
function csv(t){const R=[];let r=[],f="",q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){t[i+1]=='"'?(f+='"',i++):q=0}else f+=c}else if(c=='"')q=1;else if(c==','){r.push(f);f=""}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);R.push(r);r=[];f=""}else f+=c}if(f||r.length){r.push(f);R.push(r)}return R.filter(x=>x.some(y=>y.trim()))}
async function sheet(u){const R=csv(await(await fetch(u,{cache:"no-cache"})).text());if(R.length<1)throw new Error("empty sheet");const h=R[0].map(x=>x.trim().toLowerCase());return{rows:R.slice(1),col:(...k)=>h.findIndex(x=>k.some(y=>x.includes(y)))}}
const first=u=>(u||"").split(/[\s,]+/)[0],dr=u=>{u=first(u);const x=u.match(/(?:file\/d\/|id=)([\w-]+)/);return x?"https://drive.google.com/thumbnail?id="+x[1]+"&sz=w600":u};
async function api(a,d={}){if(!CFG.API)return null;const r=await fetch(CFG.API,{method:"POST",body:JSON.stringify({key:KEY,action:a,...d})}),j=await r.json();if(j.error)throw new Error(j.error);return j}
const status=t=>{$("#sync").textContent=t};
/* login */
$("#lf").onsubmit=async e=>{e.preventDefault();const p=$("#pw").value;if(!CFG.UI_HASH){$("#setup").textContent="FIRST-TIME SETUP\nPaste into admin.html as UI_HASH:\n"+await sha("ui:"+p)+"\n\nPaste into Code.gs as API_HASH:\n"+await sha("api:"+p);return}
if(await sha("ui:"+p)!==CFG.UI_HASH){$("#err").textContent="Wrong passphrase";return}KEY=await sha("api:"+p);sessionStorage.setItem("lc_k",KEY);enter()};
if(317204988789-vsh6i5hpuhkf7cgddthsuqs4tuvtq0g0.apps.googleusercontent.com){const g=document.createElement("script");g.src="https://accounts.google.com/gsi/client";g.onload=()=>{google.accounts.id.initialize({client_id:317204988789-vsh6i5hpuhkf7cgddthsuqs4tuvtq0g0.apps.googleusercontent.com,callback:r=>{KEY="g:"+r.credential;sessionStorage.setItem("lc_k",KEY);enter()}});google.accounts.id.renderButton($("#gbtn"),{theme:"outline",size:"large"})};document.head.appendChild(g)}
$("#out").onclick=()=>{sessionStorage.clear();location.reload()};
const TABS=[["home","Home"],["bill","New bill"],["prod","Products"],["pay","Payments"],["prof","Profile"]];
$("#nav").innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join("");
function show(t){TABS.forEach(x=>{$("#t-"+x[0]).hidden=x[0]!==t});document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));if(t==="home")home();if(t==="bill"&&!cur)newBill()}
$("#nav").onclick=e=>{if(e.target.dataset.t)show(e.target.dataset.t)};
async function enter(){$("#lock").hidden=true;$("#app").hidden=false;$("#pf").innerHTML=FIELDS.map(f=>`<label>${f[1]}</label><input id="f_${f[0]}" value="${esc(profile[f[0]])}">`).join("");show(profile.bn?"home":"prof");
try{status("Syncing…");const d=await api("get");if(d){if(d.profile&&d.profile.bn)profile=d.profile;bills=d.bills||bills;sv("lc_prof",profile);sv("lc_bills",bills);FIELDS.forEach(f=>$("#f_"+f[0]).value=profile[f[0]]||"");status("Synced")}else status("Saving on this phone only")}catch(e){if(e.message==="Not allowed"){sessionStorage.clear();alert("Not allowed. Sign in again.");location.reload();return}status("Sync failed: "+e.message)}
home();loadProducts();loadPay()}
/* home */
function home(){const mo=new Date().toISOString().slice(0,7),tot=bills.reduce((s,b)=>s+b.total,0),mt=bills.filter(b=>(b.date||"").startsWith(mo)).reduce((s,b)=>s+b.total,0),rec=pay.reduce((s,p)=>s+p.amt,0);
$("#stats").innerHTML=[["Bills",bills.length],["Total billed",m(tot)],["This month",m(mt)],["Payments logged",m(rec)],["Products",products.length]].map(x=>`<div class="card st" style="margin:0"><small>${x[0]}</small><b>${x[1]}</b></div>`).join("");
$("#recent").innerHTML=bills.length?bills.slice(-8).reverse().map(b=>`<div class="row"><div><b>${esc(b.no)}</b> · ${esc(b.cust.name)}<br><small>${esc(b.date)} · ${m(b.total)}</small></div><button class="o" data-v="${esc(b.no)}">Open</button></div>`).join(""):"No bills yet. Tap New bill to create one.";
if(!profile.bn)$("#recent").insertAdjacentHTML("afterbegin",'<p style="color:var(--r)"><b>Set up your Profile first</b> so it prints on every bill.</p>')}
$("#recent").onclick=e=>{const n=e.target.dataset.v;if(n)openInv(bills.find(b=>b.no===n))};
/* profile */
$("#sp").onclick=async()=>{FIELDS.forEach(f=>profile[f[0]]=$("#f_"+f[0]).value.trim());sv("lc_prof",profile);try{await api("saveProfile",{profile});status(CFG.API?"Profile saved":"Saved on this phone")}catch(e){status("Save failed: "+e.message)}};
/* billing */
function newBill(){cur=1;items=[];["cn","cp","ca","cg","cs"].forEach(i=>$("#"+i).value="");$("#disc").value=0;$("#inter").checked=false;$("#dt").value=new Date().toISOString().slice(0,10);addItem()}
function addItem(){items.push({d:"",h:"",q:1,r:0,g:+profile.bd||5});drawItems()}
function drawItems(){$("#items").innerHTML=items.map((x,i)=>`<div class="it"><input class="d" list="pl" data-i="${i}" data-k="d" placeholder="Item (type article no. or name)" value="${esc(x.d)}"><input data-i="${i}" data-k="h" placeholder="HSN" value="${esc(x.h)}"><input data-i="${i}" data-k="q" type="number" min="1" placeholder="Qty" value="${x.q}"><input data-i="${i}" data-k="r" type="number" min="0" placeholder="Rate ₹" value="${x.r||""}"><input data-i="${i}" data-k="g" type="number" min="0" placeholder="GST %" value="${x.g}"><button class="rd" data-x="${i}" aria-label="Remove">✕</button></div>`).join("");totals()}
$("#items").oninput=e=>{const i=e.target.dataset.i;if(i==null)return;const k=e.target.dataset.k,v=e.target.value;if(k==="d"){const p=products.find(p=>v===p.id+" — "+p.name);if(p){items[i].d=p.name+" ("+p.id+")";e.target.value=items[i].d;totals();return}items[i].d=v}else items[i][k]=k==="h"?v:+v||0;totals()};
$("#items").onclick=e=>{const x=e.target.dataset.x;if(x!=null){items.splice(x,1);if(!items.length)items.push({d:"",h:"",q:1,r:0,g:+profile.bd||5});drawItems()}};
$("#addI").onclick=addItem;$("#disc").oninput=totals;$("#inter").onchange=totals;
$("#cs").oninput=e=>{const a=e.target.value.trim().toLowerCase(),b=(profile.bs||"").trim().toLowerCase();if(a&&b)$("#inter").checked=a!==b;totals()};
function calc(){const rows=items.filter(x=>x.d||x.r).map(x=>({...x,t:x.q*x.r}));const sub=rows.reduce((s,x)=>s+x.t,0),d=Math.min(+$("#disc").value||0,sub),f=sub?(sub-d)/sub:0,gst=rows.reduce((s,x)=>s+x.t*x.g/100,0)*f,raw=sub-d+gst,total=Math.round(raw);return{rows,sub,disc:d,taxable:sub-d,gst,inter:$("#inter").checked,round:total-raw,total}}
function totals(){const c=calc();$("#tot").innerHTML=`Subtotal ${m(c.sub)}<br>Discount −${m(c.disc)}<br>${c.inter?"IGST "+m(c.gst):"CGST "+m(c.gst/2)+" + SGST "+m(c.gst/2)}<br>Round off ${m(c.round)}<h3 style="margin-top:6px">Total ${m(c.total)}</h3>`}
function build(no){const c=calc();return{...c,no,date:$("#dt").value,biz:{...profile},cust:{name:$("#cn").value.trim(),phone:$("#cp").value.trim(),addr:$("#ca").value.trim(),gstin:$("#cg").value.trim(),state:$("#cs").value.trim()}}}
function ok(){if(!profile.bn){alert("Fill your Profile first");show("prof");return 0}if(!$("#cn").value.trim()){alert("Enter customer name");return 0}if(!calc().rows.length||calc().total<=0){alert("Add at least one item with a rate");return 0}return 1}
$("#prev").onclick=()=>{if(ok())openInv(build("DRAFT"))};
$("#save").onclick=async()=>{if(!ok())return;const b=build("");b.prefix=profile.bx||"LC";try{const r=await api("saveBill",{bill:b});b.no=r?r.no:b.prefix+"-"+String(bills.length+1).padStart(4,"0")}catch(e){alert("Could not save to Google Sheet: "+e.message);return}bills.push(b);sv("lc_bills",bills);cur=null;openInv(b)};
function openInv(b){$("#ivb").innerHTML=inv(b);$("#iv").hidden=false;$("#iv").dataset.n=b.no}
$("#ivx").onclick=()=>{$("#iv").hidden=true;if($("#iv").dataset.n!=="DRAFT"&&!$("#t-bill").hidden){newBill();show("home")}};$("#ivp").onclick=()=>print();
$("#ivw").onclick=()=>{const b=bills.find(x=>x.no===$("#iv").dataset.n)||build("DRAFT");open("https://wa.me/"+wa(b.cust.phone)+"?text="+encodeURIComponent(`Hello ${b.cust.name}, your invoice ${b.no} from ${b.biz.bn||"Lone Crafts"} is ${m(b.total)}.\nThank you!${b.biz.bb?"\nPayment: "+b.biz.bb:""}`),"_blank")};
function inv(b){const p=b.biz||profile,rows=b.rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.d)}${r.h?"<br><small>HSN "+esc(r.h)+"</small>":""}</td><td>${r.q}</td><td>${m(r.r)}</td><td>${r.g}%</td><td>${m(r.t)}</td></tr>`).join(""),tx=b.inter?`IGST: ${m(b.gst)}`:`CGST: ${m(b.gst/2)}<br>SGST: ${m(b.gst/2)}`;
return`<h2>${esc(p.bn)}</h2><p>${esc(p.ba)}<br>${esc(p.bp)} ${esc(p.be)}<br>GSTIN: ${esc(p.bg)}</p><hr><p><b>TAX INVOICE</b> &nbsp; No: <b>${esc(b.no)}</b> &nbsp; Date: ${esc(b.date)}</p><p><b>Bill to:</b> ${esc(b.cust.name)}<br>${esc(b.cust.addr)}<br>${esc(b.cust.phone)} ${b.cust.gstin?"GSTIN: "+esc(b.cust.gstin):""}</p>
<table><tr><th>#</th><th>Item</th><th>Qty</th><th>Rate</th><th>GST</th><th>Amount</th></tr>${rows}</table><p style="text-align:right">Subtotal: ${m(b.sub)}<br>Discount: −${m(b.disc)}<br>${tx}<br>Round off: ${m(b.round)}<br><b style="font-size:1.2em">Total: ${m(b.total)}</b></p><p>${words(b.total)}</p>${p.bb?"<p><b>Payment:</b> "+esc(p.bb)+"</p>":""}${p.bt?"<p><small>"+esc(p.bt)+"</small></p>":""}`}
/* products */
async function loadProducts(){try{const s=await sheet(CFG.PRODUCTS_CSV),i=s.col("article"),n=s.col("name","title"),c=s.col("categ"),p=s.col("photo","image"),k=s.col("stock","avail");products=s.rows.map(r=>({id:(r[i]||"").trim(),name:(r[n]||"").trim(),cat:r[c]||"",img:dr(r[p]),out:/^(no|out|sold)/i.test(r[k]||"")})).filter(x=>x.name).reverse();$("#pl").innerHTML=products.map(p=>`<option value="${esc(p.id+" — "+p.name)}">`).join("");drawProducts()}catch(e){$("#plist").textContent="Could not load products: "+e.message}}
function drawProducts(){const t=$("#ps").value.toLowerCase(),l=products.filter(p=>(p.id+p.name+p.cat).toLowerCase().includes(t));$("#plist").innerHTML=l.length?l.map(p=>`<div class="row"><img src="${esc(p.img)}" alt="" onerror="this.style.visibility='hidden'"><div><b>${esc(p.name)}</b><br><small>${esc(p.id)} · ${esc(p.cat)}</small></div>${p.out?'<span class="tag">Out of stock</span>':""}</div>`).join(""):"No products found."}
$("#ps").oninput=drawProducts;$("#rP").onclick=loadProducts;$("#addP").onclick=()=>CFG.PRODUCT_FORM?open(CFG.PRODUCT_FORM,"_blank"):alert("Put your Google Form link in CFG.PRODUCT_FORM");
/* payments */
async function loadPay(){if(!CFG.PAYMENTS_CSV){$("#paylist").textContent="Put your payments sheet CSV link in CFG.PAYMENTS_CSV.";return}try{const s=await sheet(CFG.PAYMENTS_CSV),a=s.col("amount"),b=s.col("bill"),d=s.col("date of","date"),t=s.col("time"),im=s.col("screenshot","upload","image","photo");pay=s.rows.map(r=>({k:(r[t]||"")+(r[b]||""),amt:parseFloat(String(r[a]||"").replace(/[^\d.]/g,""))||0,bill:(r[b]||"").trim(),date:r[d]||r[t]||"",img:r[im]||""})).reverse();drawPay();home()}catch(e){$("#paylist").textContent="Could not load payments: "+e.message}}
function drawPay(){const t=$("#ys").value.toLowerCase(),v=ls("lc_v",{}),l=pay.filter(p=>p.bill.toLowerCase().includes(t));$("#paylist").innerHTML=l.length?l.map(p=>{const b=bills.find(x=>x.no.toLowerCase()===p.bill.toLowerCase()),mt=b?(Math.abs(b.total-p.amt)<1?`<span class="tag" style="background:#c9f0d8">Matches bill ${m(b.total)}</span>`:`<span class="tag" style="background:#f6d3cc">Bill total is ${m(b.total)}</span>`):'<span class="tag">Bill not found</span>';
return`<div class="row"><a href="${esc(first(p.img))}" target="_blank" rel="noopener"><img src="${esc(dr(p.img))}" alt="screenshot" onerror="this.style.visibility='hidden'"></a><div><b>${m(p.amt)}</b> · ${esc(p.bill)}<br><small>${esc(p.date)}</small><br>${mt}</div><label style="margin:0"><input type="checkbox" style="width:auto" data-k="${esc(p.k)}" ${v[p.k]?"checked":""}> Verified</label></div>`}).join(""):"No payment records yet."}
$("#paylist").onchange=e=>{const v=ls("lc_v",{});v[e.target.dataset.k]=e.target.checked;sv("lc_v",v)};$("#ys").oninput=drawPay;$("#rY").onclick=loadPay;
if(CFG.UI_HASH&&sessionStorage.getItem("lc_k")){KEY=sessionStorage.getItem("lc_k");enter()}
</script></body></html>
